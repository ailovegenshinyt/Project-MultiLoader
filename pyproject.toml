[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiloader"
version = "1.0.0"
description = "Premium Multi-Source Downloader with Liquid Glass UI - Download YouTube videos and Spotify tracks with beautiful UI"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = ailovegenshinyt
CoR3 · Zero", email = "ailovegenshinyt@gmail.com"}
]
keywords = ["youtube", "spotify", "downloader", "yt-dlp", "video", "audio", "music", "CoR3", "Multiloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    "flask>=2.3.0",
    "yt-dlp>=2023.11.16",
    "requests>=2.31.0",
    "curl-cffi>=0.5.9",
    "pillow>=10.0.0",
    "imageio-ffmpeg>=0.4.9",
]

[project.urls]
Homepage = "https://github.com/ailovegenshinyt/Project-MultiLoader"
Repository = "https://github.com/ailovegenshinyt/Project-MultiLoader"
Issues = "https://github.com/ailovegenshinyt/Project-MultiLoader/issues"

[project.scripts]
multiloader = "multiloader.main:run"

[tool.setuptools]
packages = ["multiloader"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
multiloader = ["templates/*", "static/*"]
